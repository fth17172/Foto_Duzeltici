<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fotoğraf Netleştirici</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { background: #1e293b; padding: 2rem; border-radius: 12px; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
    input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 0.9rem; color: #94a3b8; }
    .result-box { margin-top: 20px; display: none; }
    img { max-width: 100%; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
    a.btn-download { display: inline-block; padding: 10px 15px; background: #10b981; color: white; text-decoration: none; border-radius: 6px; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI Fotoğraf Netleştirici</h1>
  
  <input type="file" id="fileInput" accept="image/*" />
  <button id="processBtn" onclick="processImage()">Netleştir</button>
  
  <div id="status" class="status"></div>

  <div id="resultBox" class="result-box">
    <h3>Sonuç:</h3>
    <img id="outputImg" src="" alt="Netleşmiş Fotoğraf" />
    <br>
    <a id="downloadBtn" class="btn-download" href="" download="netlestirilmis.png">Görseli İndir</a>
  </div>
</div>

<script>
  const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  async function processImage() {
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const btn = document.getElementById('processBtn');
    const resultBox = document.getElementById('resultBox');
    const outputImg = document.getElementById('outputImg');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!fileInput.files[0]) { alert('Lütfen bir fotoğraf seç!'); return; }

    try {
      btn.disabled = true;
      status.innerText = 'Görsel işleniyor ve sunucuya gönderiliyor...';

      const file = fileInput.files[0];
      const imageBase64 = await toBase64(file);

      // 1. İşlemi Başlat
      const response = await fetch('/api/upscale', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageBase64 })
      });

      const textData = await response.text();
      let data;
      try {
        data = JSON.parse(textData);
      } catch (e) {
        throw new Error("Sunucu yanıt veremedi (Görsel boyutu çok büyük olabilir).");
      }

      if (!response.ok || data.error) throw new Error(data.error || 'İşlem başlatılamadı');

      const predictionId = data.id;
      status.innerText = 'Yapay zeka çalışıyor, durum kontrol ediliyor...';

      // 2. Durumu Takip Et
      let prediction = { status: data.status };
      while (prediction.status !== 'succeeded' && prediction.status !== 'failed') {
        await new Promise(r => setTimeout(r, 2000));
        
        const checkRes = await fetch(`/api/upscale?id=${predictionId}`);
        const checkText = await checkRes.text();
        try {
          prediction = JSON.parse(checkText);
        } catch (e) {
          continue;
        }
      }

      if (prediction.status === 'succeeded') {
        status.innerText = 'Görsel hazırlanıyor...';
        
        const imageUrl = Array.isArray(prediction.output) ? prediction.output[0] : prediction.output;
        outputImg.src = imageUrl;

        // Görseli indirme hatasını (Sitede dosyaya ulaşılamadı) çözen Blob yapısı
        const imgRes = await fetch(imageUrl);
        const blob = await imgRes.blob();
        const blobUrl = URL.createObjectURL(blob);

        downloadBtn.href = blobUrl;
        downloadBtn.download = "netlestirilmis.png";
        
        status.innerText = 'İşlem tamamlandı!';
        resultBox.style.display = 'block';
      } else {
        status.innerText = 'Hata: ' + (prediction.error || 'İşlem başarısız');
      }

    } catch (err) {
      console.error(err);
      status.innerText = 'Hata: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>

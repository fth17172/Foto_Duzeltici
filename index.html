<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotoğraf Netleştirici (Süper Çözünürlük)</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { background: #1e293b; padding: 2rem; border-radius: 12px; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 0.9rem; color: #94a3b8; }
    .result-box { margin-top: 20px; display: none; }
    img { max-width: 100%; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
    a.btn-download { display: inline-block; padding: 10px 15px; background: #10b981; color: white; text-decoration: none; border-radius: 6px; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>AI Fotoğraf Netleştirici</h1>
  
  <input type="text" id="apiKey" placeholder="Replicate API Token (r8_...)" />
  <input type="file" id="fileInput" accept="image/*" />
  
  <button id="processBtn" onclick="processImage()">Netleştir</button>
  
  <div id="status" class="status"></div>

  <div id="resultBox" class="result-box">
    <h3>Sonuç:</h3>
    <img id="outputImg" src="" alt="Netleşmiş Fotoğraf" />
    <br>
    <a id="downloadBtn" class="btn-download" href="" target="_blank" download="netlestirilmis.png">Görseli İndir</a>
  </div>
</div>

<script>
  // Görseli Base64 formatına çevirme
  const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  async function processImage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const btn = document.getElementById('processBtn');
    const resultBox = document.getElementById('resultBox');
    const outputImg = document.getElementById('outputImg');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!apiKey) { alert('Lütfen Replicate API anahtarını gir!'); return; }
    if (!fileInput.files[0]) { alert('Lütfen bir fotoğraf seç!'); return; }

    try {
      btn.disabled = true;
      status.innerText = 'Fotoğraf işleniyor, Base64 dönüştürülüyor...';
      
      const file = fileInput.files[0];
      const imageBase64 = await toBase64(file);

      status.innerText = 'Replicate sunucularına istek gönderiliyor...';

      // Real-ESRGAN Modeli Tetikleme
      const response = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST',
        headers: {
          'Authorization': `Token ${apiKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          version: "42a346882b0f20d6f228471f4967362f6d0f62d100063f25c7e3f848074f386c",
          input: {
            image: imageBase64,
            scale: 2,
            face_enhance: true
          }
        })
      });

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error);
      }

      status.innerText = 'Görsel işleniyor, bekleniyor...';
      
      // İşlem bitene kadar döngüye gir (Polling)
      let prediction = data;
      while (prediction.status !== 'succeeded' && prediction.status !== 'failed') {
        await new Promise(r => setTimeout(r, 2000));
        const checkRes = await fetch(`https://api.replicate.com/v1/predictions/${prediction.id}`, {
          headers: { 'Authorization': `Token ${apiKey}` }
        });
        prediction = await checkRes.json();
      }

      if (prediction.status === 'succeeded') {
        status.innerText = 'İşlem tamamlandı!';
        outputImg.src = prediction.output;
        downloadBtn.href = prediction.output;
        resultBox.style.display = 'block';
      } else {
        status.innerText = 'İşlem başarısız oldu: ' + (prediction.error || 'Bilinmeyen hata');
      }

    } catch (err) {
      console.error(err);
      status.innerText = 'Hata oluştu: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
